# Paket ini berdiri sendiri (dipasang dengan --ignore-workspace) dan butuh
# setelan pnpm-nya sendiri; ia tidak mewarisi milik repo induk.
autoInstallPeers: true
strictPeerDependencies: false

# Jangan menjalankan `pnpm install` sebelum tiap skrip — pemeriksaan itu yang
# menggagalkan `pnpm build` di sini, bukan build-nya sendiri.
verifyDepsBeforeRun: false

# Docusaurus mengandalkan build native ketiganya; tanpa ini pnpm menahannya
# dan build gagal dengan pesan yang tidak menyebut penyebabnya.
allowBuilds:
  '@swc/core': set this to true or false
  core-js: set this to true or false
  esbuild: set this to true or false
