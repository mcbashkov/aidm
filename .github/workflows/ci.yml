# CI (§7.2 Tahap 1): typecheck + lint + test suite parser.
# Test parser menguji jalur fallback yang deterministik — tanpa API key.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versi pnpm TIDAK ditulis di sini. Satu-satunya sumber kebenaran adalah
      # field "packageManager" di package.json — action ini membacanya sendiri.
      # Menuliskannya di dua tempat membuat action gagal keras (bukan sekadar
      # memperingatkan) begitu kedua angka berbeda.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # ≥22.18 — runner test memakai type stripping bawaan Node.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:parser
